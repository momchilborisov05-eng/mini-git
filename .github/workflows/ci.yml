name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests (stdlib only, no dependencies)
        run: python -m unittest -v
      - name: Install the package and smoke-test the console script
        shell: bash
        env:
          MGIT_AUTHOR_NAME: CI
          MGIT_AUTHOR_EMAIL: ci@example.com
        run: |
          pip install .
          cd "$RUNNER_TEMP" && mkdir smoke && cd smoke
          mgit init
          echo "hello" > hello.txt
          mgit add . && mgit commit -m "first"
          mgit log --oneline
          test "$(mgit cat-file -t HEAD)" = "commit"
          test "$(mgit hash-object hello.txt)" = "$(git hash-object hello.txt)"
      - name: Benchmark (informational)
        if: matrix.python == '3.13'
        shell: bash
        run: python bench/benchmark.py --runs 1 | tee -a "$GITHUB_STEP_SUMMARY"
